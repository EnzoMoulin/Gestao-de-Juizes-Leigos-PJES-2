<script>
// Este bloco é carregado antes de App.html para que falhas de inicialização
// não deixem o usuário preso no indicador de carregamento.
(function () {
  function stillStarting() {
    var loading = document.getElementById('loading');
    var app = document.getElementById('app');
    return loading && !loading.hidden && app && app.hidden;
  }

  function showStartupFailure(message) {
    if (!stillStarting()) return;
    var loading = document.getElementById('loading');
    var login = document.getElementById('login');
    var loginError = document.getElementById('loginError');
    if (loading) loading.hidden = true;
    if (login) login.hidden = false;
    if (loginError) loginError.textContent = message;
  }

  window.addEventListener('error', function (event) {
    if (!event.message) return;
    showStartupFailure('Não foi possível iniciar o site. ' + event.message +
      ' Confira se todos os arquivos foram atualizados e publique uma nova versão no Apps Script.');
  });

  window.addEventListener('unhandledrejection', function (event) {
    var reason = event.reason;
    showStartupFailure('A inicialização falhou. ' +
      (reason && reason.message ? reason.message : 'Recarregue a página e tente novamente.'));
  });

  // O login pode envolver até três chamadas sequenciais de 20 s cada.
  setTimeout(function () {
    showStartupFailure('A inicialização demorou mais que o esperado. Recarregue a página. Se persistir, confira a versão publicada e o console do navegador.');
  }, 75000);
}());
</script>
