<script>
function storage(area,method,...args){try{return window[area][method](...args);}catch(error){return null;}}
const state={token:storage('sessionStorage','getItem','jl_session')||'',data:null,config:null,currentRequest:null,users:null,judgeRecords:[],tourStep:0,page:1,requestView:storage('localStorage','getItem','jl_request_view')==='table'?'table':'cards'};
const $=id=>document.getElementById(id);

function server(name,...args){return new Promise((resolve,reject)=>{let settled=false;const timer=setTimeout(()=>{if(!settled){settled=true;reject(new Error(['apiDesignarJuiz','apiAtualizarSolicitacao','apiSalvarUsuario','apiSalvarJuiz'].includes(name)?'O servidor não confirmou a gravação em 20 segundos. A operação pode ter sido concluída. Antes de repetir, feche esta tela, atualize os dados e confira o histórico.':'O Apps Script não respondeu em 20 segundos. Verifique a implantação e as permissões do navegador.'));}},20000);const ok=value=>{if(settled)return;settled=true;clearTimeout(timer);resolve(value);};const fail=error=>{if(settled)return;settled=true;clearTimeout(timer);reject(new Error(error&&error.message||String(error)));};try{google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[name](...args);}catch(error){fail(error);}});}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeText(value){return String(value||'—').split(/(https?:\/\/[^\s<>"']+)/g).map(part=>/^https?:\/\//.test(part)?`<a href="${esc(part)}" target="_blank" rel="noopener noreferrer">${esc(part)}</a>`:esc(part).replace(/\n/g,'<br>')).join('');}
function toast(message,type='success'){const el=$('toast');el.textContent=message;el.className='toast '+type;el.hidden=false;setTimeout(()=>el.hidden=true,4200);}
function formatDate(value,withTime=false){if(!value)return '—';const raw=/^\d{4}-\d{2}-\d{2}$/.test(value)?value+'T12:00:00':value;const date=new Date(raw);if(isNaN(date.getTime()))return String(value);return new Intl.DateTimeFormat('pt-BR',withTime?{dateStyle:'short',timeStyle:'short'}:{dateStyle:'short'}).format(date);}
function statusClass(status){return ({Pendente:'status-pendente','Em atendimento':'status-em-atendimento','Concluído':'status-concluido',Cancelado:'status-cancelado'})[status]||'status-pendente';}
function priorityClass(priority){return 'priority-'+String(priority||'normal').toLowerCase();}
function showLogin(message=''){$('loading').hidden=true;$('app').hidden=true;$('login').hidden=false;$('loginError').textContent=message;}

async function boot(){$('loading').hidden=false;$('login').hidden=true;$('app').hidden=true;try{state.config=await server('apiConfiguracaoPublica');if(state.token){try{return await loadData();}catch(error){storage('sessionStorage','removeItem','jl_session');state.token='';}}$('loginError').textContent='Identificando sua conta institucional…';const result=await server('apiLogin');state.token=result.token;storage('sessionStorage','setItem','jl_session',state.token);await loadData();}catch(error){showLogin(error.message||'Não foi possível identificar a conta institucional.');}}

async function loadData(silent=false){
  if(state.loading)return;
  state.loading=true;
  const requestToken=state.token;
  if(!silent)$('loading').hidden=false;
  try{
    const data=await server('apiBootstrap',state.token);
    if(!state.token||state.token!==requestToken)return;
    if(silent&&document.querySelector('dialog[open]'))return;
    state.data=data;render();$('login').hidden=true;$('app').hidden=false;
    $('refreshStatus').textContent='';$('refreshStatus').hidden=true;
  }catch(error){
    if(state.token!==requestToken)return;
    if(/Sessão|acesso revogado/.test(error.message)){
      storage('sessionStorage','removeItem','jl_session');state.token='';showLogin(error.message);
    }else if(state.data){
      $('refreshStatus').textContent='Não foi possível atualizar. Os dados abaixo são da última leitura. '+error.message;
      $('refreshStatus').hidden=false;
    }
    if(!silent)throw error;
  }finally{state.loading=false;$('loading').hidden=true;}
}
async function refreshData(){try{await loadData(Boolean(state.data));}catch(error){toast(error.message,'error');}}
function renderSource(){
  const f=state.data.fonte;$('sourceDetails').hidden=!f;if(!f)return;
  $('sourceName').textContent=f.planilha+' — aba: '+f.aba;
  $('sourceLink').href=f.url;
  $('sourceId').textContent='ID da planilha: '+f.id;
  $('sourceCounts').textContent=f.respostas+' respostas · '+f.solicitacoes+' solicitações · '+f.juizesAtivos+' juízes ativos · '+f.juizesEncerrados+' cadastros de juízes encerrados';
  $('sourceWarnings').textContent=(!f.quantidadeGestaoConfigurada?'A aba GESTAO_SOLICITACOES ainda não tem QUANTIDADE_MINUTAS. Execute prepararProjetoNoEditor_ antes de designar ou editar solicitações. ':'')+(f.totalIgnoradas?'Há '+f.totalIgnoradas+' resposta(s) com função não reconhecida: '+f.ignoradas.map(r=>'linha '+r.linha+' ('+r.cargo+')').join('; ')+'. ':'')+(f.statusDesconhecidos.length?'Status não reconhecido nas linhas: '+f.statusDesconhecidos.join(', ')+'. Confira a planilha.':'');
}

function render(){const d=state.data;$('userName').textContent=d.usuario.nome||'Usuário';$('userEmail').textContent=d.usuario.email||'';$('userRole').textContent=d.usuario.perfil;$('scopeText').textContent=d.permissoes.gerenciar?'Você visualiza todas as solicitações e pode realizar designações e atualizações.':'Você possui acesso de consulta e visualiza somente solicitações vinculadas ao seu e-mail.';$('lastUpdated').textContent='Dados atualizados em '+formatDate(d.atualizadoEm,true);$('managementNotice').hidden=!d.permissoes.gerenciar;$('adminTab').hidden=!d.permissoes.administrar;if(!d.permissoes.administrar){state.users=null;state.judgeRecords=[];$('usersTable').innerHTML='';if($('adminJudgesTable'))$('adminJudgesTable').innerHTML='';if(!$('adminPanel').hidden)setActiveTab('requests');}renderSource();renderMetrics();renderAlerts();fillFilters();renderRequests(false);renderJudges();}

function renderMetrics(){const m=state.data.metricas;const metrics=[['Solicitações',m.total,'Visíveis para seu perfil'],['Pendentes',m.pendentes,'Aguardando início'],['Em atendimento',m.emAtendimento,'Demandas em execução'],['Juízes disponíveis',m.disponiveis,'Com saldo validado']];$('metrics').innerHTML=metrics.map(([label,value,description])=>`<article class="metric"><span>${label}</span><strong>${value}</strong><small>${description}</small></article>`).join('');}

function renderAlerts(){const m=state.data.metricas;const alerts=[];if(m.atrasadas)alerts.push(`<button type="button" class="alert danger" onclick="applyQuickFilter('overdue')"><strong>${m.atrasadas} atrasada(s)</strong><span>Ver prazos vencidos</span></button>`);if(m.semJuiz)alerts.push(`<button type="button" class="alert warning" onclick="applyQuickFilter('unassigned')"><strong>${m.semJuiz} sem juiz</strong><span>Ver solicitações</span></button>`);if(m.antigas)alerts.push(`<button type="button" class="alert info" onclick="applyQuickFilter('old')"><strong>${m.antigas} antiga(s)</strong><span>Há pelo menos 7 dias</span></button>`);const upcoming=state.data.solicitacoes.filter(isUpcoming).length;if(upcoming)alerts.push(`<button type="button" class="alert info" onclick="applyQuickFilter('upcoming')"><strong>${upcoming} com prazo próximo</strong><span>Hoje e próximos 7 dias</span></button>`);$('operationalAlerts').innerHTML=alerts.join('');$('operationalAlerts').hidden=!alerts.length;}

function uniqueValues(key){return [...new Set(state.data.solicitacoes.map(item=>String(item[key]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));}
function setOptions(id,values,first){const current=$(id).value;$(id).innerHTML=`<option value="">${first}</option>`+values.map(value=>`<option>${esc(value)}</option>`).join('');if(values.includes(current))$(id).value=current;}
function fillFilters(){setOptions('statusFilter',state.data.statusPermitidos,'Todos');setOptions('priorityFilter',state.data.prioridadesPermitidas,'Todas');setOptions('judgeFilter',uniqueValues('juiz'),'Todos');setOptions('unitFilter',uniqueValues('unidade'),'Todas');$('editStatus').innerHTML=state.data.statusPermitidos.map(x=>`<option>${esc(x)}</option>`).join('');$('editPriority').innerHTML=state.data.prioridadesPermitidas.map(x=>`<option>${esc(x)}</option>`).join('');$('editJudge').innerHTML='<option value="">Selecione uma pessoa</option>'+state.data.juizes.map(j=>`<option>${esc(j.nome)}</option>`).join('');}

function filteredRequests(){const term=normalizeSearch($('search').value);const status=$('statusFilter').value;const priority=$('priorityFilter').value;const judge=$('judgeFilter').value;const unit=$('unitFilter').value;const flag=$('flagFilter').value;const rows=state.data.solicitacoes.filter(r=>(!term||normalizeSearch([r.id,r.unidade,r.solicitante,r.juiz,r.status,r.competencias,r.observacoes,r.detalhes&&r.detalhes.processos].join(' ')).includes(term))&&(!status||r.status===status)&&(!priority||r.prioridade===priority)&&(!judge||r.juiz===judge)&&(!unit||r.unidade===unit)&&(!flag||(flag==='unassigned'&&!r.juiz&&!['Concluído','Cancelado'].includes(r.status))||(flag==='overdue'&&r.atrasada)||(flag==='upcoming'&&isUpcoming(r))||(flag==='old'&&r.diasEspera>=7&&!['Concluído','Cancelado'].includes(r.status))));const order=$('sortFilter').value;const priorityOrder={Urgente:0,Alta:1,Normal:2};return rows.sort((a,b)=>{if(order==='oldest')return a.id-b.id;if(order==='newest')return b.id-a.id;if(order==='deadline')return (a.prazo||'9999-12-31').localeCompare(b.prazo||'9999-12-31');if(a.atrasada!==b.atrasada)return a.atrasada?-1:1;return priorityOrder[a.prioridade]-priorityOrder[b.prioridade]||b.id-a.id;});}

function requestTags(r){const tags=[`<span class="badge ${statusClass(r.status)}">${esc(r.status)}</span>`,`<span class="priority ${priorityClass(r.prioridade)}">${esc(r.prioridade)}</span>`];if(r.quantidadeInformada&&!r.quantidadeValida)tags.push('<span class="priority priority-alta">Revisar quantidade</span>');else if(!r.quantidadeInformada)tags.push('<span class="priority priority-nao-informada">Quantidade não informada</span>');if(r.atrasada)tags.push('<span class="priority overdue">Prazo vencido</span>');return tags.join('');}
function renderRequests(resetPage=true){if(resetPage)state.page=1;const all=filteredRequests();const size=Number($('pageSize').value)||25;const pages=Math.max(1,Math.ceil(all.length/size));state.page=Math.max(1,Math.min(state.page,pages));const rows=all.slice((state.page-1)*size,state.page*size);$('pageSummary').textContent='Página '+state.page+' de '+pages;$('pagination').hidden=all.length<=size;$('previousPage').disabled=state.page===1;$('nextPage').disabled=state.page===pages;$('cardsView').setAttribute('aria-pressed',String(state.requestView==='cards'));$('tableView').setAttribute('aria-pressed',String(state.requestView==='table'));$('resultCount').textContent=all.length+' de '+state.data.solicitacoes.length+' solicitação(ões)';$('requests').innerHTML=rows.length?rows.map(r=>`<article class="request-card ${r.atrasada?'is-overdue':''}"><div class="request-head"><div><p class="record-label">Solicitação #${r.id}</p><h3>${esc(r.unidade||'Unidade não informada')}</h3><div class="meta">${esc(r.solicitante||'Solicitante não informado')} ${r.data?'· '+esc(r.data):''}</div></div><div class="tag-row">${requestTags(r)}</div></div><div class="details"><div><small>Minutas solicitadas</small><strong>${esc(r.quantidade||'—')}</strong></div><div><small>Juiz designado</small><strong>${esc(r.juiz||'Ainda não designado')}</strong></div><div><small>Prazo</small><strong>${formatDate(r.prazo)}</strong></div><div><small>Dias desde solicitação</small>${r.diasEspera} dia(s)</div><div><small>Competências</small>${esc(r.competencias||'Não informadas')}</div><div><small>Última gestão</small>${r.atualizadoEm?formatDate(r.atualizadoEm,true):'—'}</div></div><div class="card-actions"><button class="secondary" type="button" onclick="openDetails(${r.id})">Ver detalhes</button>${state.data.permissoes.gerenciar?`<button type="button" onclick="openEdit(${r.id})">Gerenciar</button>`:''}</div></article>`).join(''):'<div class="empty"><strong>Nenhuma solicitação encontrada.</strong><span>Remova algum filtro ou pesquise outro termo.</span></div>';if(rows.length&&state.requestView==='table')$('requests').innerHTML=requestTable(rows);}

function renderJudges(){const term=normalizeSearch($('judgeSearch').value);const rows=state.data.juizes.filter(j=>normalizeSearch([j.nome,j.materias,j.observacoes].join(' ')).includes(term));const review=state.data.juizes.filter(j=>j.requerRevisao).length;$('capacityWarning').hidden=!review;$('capacityWarning').textContent=review+' cadastro(s) precisam de revisão de capacidade, quantidade atribuída, status ou nome duplicado. Eles não entram no indicador de disponíveis.';$('judgeCount').textContent=rows.length+' de '+state.data.juizes.length+' cadastro(s) ativo(s)';$('judges').innerHTML=rows.length?rows.map(j=>{const cap=j.capacidadeValida?`${j.designadas} de ${j.capacidadeNumerica} minutas`:`Capacidade pendente de revisão`;const saldo=j.requerRevisao||typeof j.disponiveis!=='number'?'Saldo indisponível até revisão':j.disponiveis+' minutas livres';const cargaParcial=j.cargaParcial?`<small class="capacity-note">Carga parcial: ${j.quantidadesAtribuidasAusentes.length} solicitação(ões) ativa(s) sem quantidade informada. Isso não invalida a capacidade declarada; o saldo considera somente as quantidades conhecidas.</small>`:'';return `<article class="judge-card ${j.lotado?'is-full':''}"><div class="request-head"><div><p class="record-label">Disponibilidade #${j.id}</p><h3>${esc(j.nome||'Nome não informado')}</h3></div><span class="badge ${j.requerRevisao?'status-pendente':j.lotado?'status-cancelado':'status-concluido'}">${j.requerRevisao?'Revisar cadastro':j.lotado?'Capacidade atingida':'Disponível'}</span></div><div class="capacity-line"><div><strong>${cap}</strong><span>${saldo}</span></div><strong>${j.requerRevisao?'—':j.percentualOcupacao+'%'}</strong></div><div class="progress" ${j.requerRevisao?'hidden':''}><span style="width:${j.percentualOcupacao}%"></span></div>${cargaParcial}<div class="details"><div><small>Matérias</small>${esc(j.materias||'Não informadas')}</div><div><small>Observações</small>${esc(j.observacoes||'Nenhuma')}</div>${j.contato?`<div><small>Contato</small><a href="mailto:${esc(j.contato.email||'')}">${esc(j.contato.email||'—')}</a><br>${esc(j.contato.telefone||'')}</div>`:''}</div></article>`;}).join(''):'<div class="empty"><strong>Nenhum juiz disponível.</strong><span>Confira os registros e status na planilha vinculada.</span></div>';}

function detailItem(label,value,wide=false){return `<div class="detail-item ${wide?'wide':''}"><small>${label}</small><div>${safeText(value)}</div></div>`;}
function detailProcesses(value){return `<div class="detail-item wide"><small>Processos</small><div>${safeText(value)}</div>${value?'<button class="secondary inline-copy" type="button" onclick="copyProcesses()">Copiar números dos processos</button>':''}</div>`;}
async function copyProcesses(){const value=state.currentRequest&&state.currentRequest.detalhes&&state.currentRequest.detalhes.processos;if(!value)return;try{await navigator.clipboard.writeText(String(value));toast('Números dos processos copiados.');}catch(error){const area=document.createElement('textarea');area.value=String(value);document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();toast('Números dos processos copiados.');}}
async function openDetails(id){const r=state.data.solicitacoes.find(x=>x.id===id);if(!r)return toast('Solicitação não encontrada.','error');const historyToken=state.token;state.currentRequest=r;$('detailRef').textContent='#'+id;$('detailTitle').textContent=r.unidade||'Unidade não informada';$('detailStatusRow').innerHTML=requestTags(r);const d=r.detalhes||{};$('detailGrid').innerHTML=[detailItem('Solicitante',r.solicitante),detailItem('E-mail',d.email||r.email),detailItem('Telefone',d.telefone),detailItem('Data da solicitação',r.data),detailItem('Minutas solicitadas',r.quantidade),detailItem('Juiz designado',r.juiz||'Não designado'),detailItem('Data da designação',r.dataDesignacao),detailItem('Prioridade',r.prioridade),detailItem('Prazo',formatDate(r.prazo)),detailItem('Competências',r.competencias,true),detailProcesses(d.processos),detailItem('Orientações e links',d.orientacoes,true),detailItem('Preferência indicada',r.preferencia,true),detailItem('Produtividade',d.produtividade,true),detailItem('Observações do atendimento',r.observacoes,true)].join('');$('detailsManageButton').hidden=!state.data.permissoes.gerenciar;$('detailsManageButton').onclick=()=>{ $('detailsDialog').close();openEdit(id);};$('historyList').innerHTML='<div class="empty compact-empty">Carregando histórico…</div>';$('detailsDialog').showModal();try{const items=await server('apiHistoricoSolicitacao',state.token,id);if(state.token===historyToken&&state.currentRequest&&state.currentRequest.id===id)renderHistory(items);}catch(error){if(state.token!==historyToken||!state.currentRequest||state.currentRequest.id!==id)return;$('historyList').innerHTML=`<div class="error">${esc(error.message)}</div>`;}}

function actionLabel(action){return ({DESIGNAR_JUIZ:'Juiz designado',REDESIGNAR_JUIZ:'Juiz substituído',ATUALIZAR_SOLICITACAO:'Andamento atualizado',CRIAR_USUARIO:'Usuário criado',ATUALIZAR_USUARIO:'Usuário atualizado',ATUALIZAR_JUIZ:'Cadastro de juiz atualizado'})[action]||action.replace(/_/g,' ');}
function changesHtml(item){const keys=[...new Set(Object.keys(item.antes||{}).concat(Object.keys(item.depois||{})))];return keys.filter(key=>JSON.stringify(item.antes[key])!==JSON.stringify(item.depois[key])).map(key=>`<div><small>${esc(key)}</small><span>${esc(item.antes[key]??'—')} → <strong>${esc(item.depois[key]??'—')}</strong></span></div>`).join('');}
function renderHistory(items){$('historyList').innerHTML=items.length?items.map(item=>`<article class="history-item"><div class="history-dot"></div><div><div class="history-head"><strong>${esc(actionLabel(item.acao))}</strong><time>${formatDate(item.data,true)}</time></div><p>${esc(item.email)} · ${esc(item.perfil)}</p><div class="history-changes">${changesHtml(item)}</div></div></article>`).join(''):'<div class="empty compact-empty">Ainda não existem alterações administrativas para esta solicitação.</div>';}

function openEdit(id){const r=state.data.solicitacoes.find(x=>x.id===id);if(!r)return toast('Solicitação não encontrada.','error');state.currentRequest=r;$('editId').value=id;$('editRequestRef').textContent='#'+id;$('editRequestSummary').textContent=(r.unidade||'Unidade não informada')+' · '+(r.solicitante||'Solicitante não informado');if(r.juiz&&!Array.from($('editJudge').options).some(option=>option.value===r.juiz))$('editJudge').add(new Option(r.juiz,r.juiz));$('editJudge').value=r.juiz||'';$('editStatus').value=r.status;$('editNotes').value=r.observacoes||'';$('editPriority').value=r.prioridade||'Normal';$('editDeadline').value=r.prazo||'';$('editQuantity').value=r.quantidadeValida?r.quantidadeNumerica:(r.quantidade||'');$('assignmentReason').value='';$('reopenReason').value='';$('reopenConfirm').checked=false;updateReopenCapacity();$('editError').textContent='';updateAssignmentCapacity();$('editDialog').showModal();}
function selectedJudge(){return state.data.juizes.find(j=>j.nome===$('editJudge').value);}
function positiveQuantityInput(){const texto=String($('editQuantity').value||'').trim();if(!/^\d+$/.test(texto))return null;const numero=Number(texto);return Number.isSafeInteger(numero)&&numero>0?numero:null;}
function updateAssignmentCapacity(){const j=selectedJudge(),r=state.currentRequest;if(!j||!r){$('assignmentCapacity').innerHTML='<span>Selecione uma pessoa para visualizar a capacidade.</span>';$('overCapacityFields').hidden=true;return;}const quantidade=positiveQuantityInput();const alreadyAssigned=normalizeSearch(r.juiz)===normalizeSearch(j.nome)&&!['Concluído','Cancelado'].includes(r.status)&&r.quantidadeValida?r.quantidadeNumerica:0;const projected=quantidade===null?null:j.designadas-alreadyAssigned+quantidade;const exceeds=quantidade!==null&&j.capacidadeValida&&projected>j.capacidadeNumerica;const saldo=`<span>Carga atual: ${j.designadas}${j.capacidadeNumerica?' de '+j.capacidadeNumerica:''} minutas${projected===null?' · Informe a quantidade para simular a designação':' · Após designação: '+projected+(j.capacidadeNumerica?' de '+j.capacidadeNumerica:'')+' minutas'}</span>`;$('assignmentCapacity').innerHTML=`<strong>${esc(j.nome)}</strong>${saldo}${j.requerRevisao?'<b>Revise o cadastro do juiz antes de designar.</b>':quantidade===null?'<b>Informe um número inteiro positivo de minutas para esta solicitação.</b>':exceeds?'<b>Esta designação excede a capacidade declarada.</b>':''}`;$('assignmentCapacity').classList.toggle('danger',exceeds);$('overCapacityFields').hidden=!exceeds;}
async function busy(button,fn){if(state.saving)return;state.saving=true;const original=button.textContent;button.disabled=true;button.textContent='Processando…';$('editError').textContent='';try{await fn();}catch(error){$('editError').textContent=error.message;}finally{state.saving=false;button.disabled=false;button.textContent=original;}}
function notificationMessage(base,result){const n=result&&result.notificacao;if(!n||n.enviada)return n&&n.enviada?base+' E-mail enviado.':base;return base+' E-mail não enviado: '+n.motivo+'.';}

$('assignButton').onclick=()=>busy($('assignButton'),async()=>{const judge=selectedJudge();if(!judge)throw new Error('Selecione uma juíza ou um juiz antes de confirmar.');const r=state.currentRequest;const quantidade=positiveQuantityInput();if(quantidade===null)throw new Error('Informe um número inteiro positivo de minutas para esta solicitação.');if($('editNotes').value.trim()!==String(r.observacoes||'').trim())throw new Error('Salve as observações em “Salvar andamento” antes de designar.');const alreadyAssigned=normalizeSearch(r.juiz)===normalizeSearch(judge.nome)&&!['Concluído','Cancelado'].includes(r.status)&&r.quantidadeValida?r.quantidadeNumerica:0;if(judge.requerRevisao)throw new Error('Revise o cadastro do juiz na origem antes de designar.');const exceeds=judge.capacidadeValida&&judge.designadas-alreadyAssigned+quantidade>judge.capacidadeNumerica;const reason=$('assignmentReason').value.trim();if(exceeds&&reason.length<5)throw new Error('Informe uma justificativa para exceder a capacidade.');const action=r.juiz&&r.juiz!==judge.nome?'Substituir '+r.juiz+' por '+judge.nome:'Designar '+judge.nome;if(!window.confirm(action+' e mudar o status para “Em atendimento”?'))return;const result=await server('apiDesignarJuiz',state.token,Number($('editId').value),judge.nome,reason,exceeds,$('editPriority').value,$('editDeadline').value,r.versao,quantidade);$('editDialog').close();toast(notificationMessage('Designação, prioridade, prazo e quantidade registrados.',result));await loadData();});
$('saveButton').onclick=()=>busy($('saveButton'),async()=>{const status=$('editStatus').value,notes=$('editNotes').value.trim(),anterior=state.currentRequest.status,quantidadeTexto=String($('editQuantity').value||'').trim();if(quantidadeTexto&&positiveQuantityInput()===null)throw new Error('A quantidade da solicitação deve ser um inteiro positivo de minutas, ou ficar vazia enquanto aguarda conferência.');if(['Concluído','Cancelado'].includes(status)&&notes.length<5)throw new Error('Explique nas observações por que a solicitação será concluída ou cancelada.');if(status!==anterior&&['Concluído','Cancelado'].includes(status)&&!window.confirm('Confirmar a alteração do status para “'+status+'”?'))return;if(status!==anterior&&['Concluído','Cancelado'].includes(anterior)&&!['Concluído','Cancelado'].includes(status)&&!window.confirm('Reabrir esta solicitação com o status “'+status+'”?'))return;const result=await server('apiAtualizarSolicitacao',state.token,Number($('editId').value),status,notes,$('editPriority').value,$('editDeadline').value,state.currentRequest.versao,$('reopenReason').value.trim(),$('reopenConfirm').checked,quantidadeTexto);$('editDialog').close();toast(notificationMessage('Andamento, prioridade, prazo e quantidade registrados.',result));await loadData();});

function applyQuickFilter(flag){clearFilters();setActiveTab('requests');$('flagFilter').value=flag;renderRequests();}
function clearFilters(){$('search').value='';['statusFilter','priorityFilter','judgeFilter','unitFilter','flagFilter'].forEach(id=>$(id).value='');$('sortFilter').value='priority';renderRequests();}
function csvCell(value){let text=String(value??'');if(/^[\s]*[=+@-]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"';}
function exportRequests(){const rows=filteredRequests();if(!rows.length)return toast('Não existem solicitações para exportar.','error');const headers=['Registro','Data','Solicitante','Unidade','Minutas solicitadas','Juiz','Status','Prioridade','Prazo','Dias desde solicitação','Competências','Observações'];const values=rows.map(r=>[r.id,r.data,r.solicitante,r.unidade,r.quantidade,r.juiz,r.status,r.prioridade,r.prazo,r.diasEspera,r.competencias,r.observacoes]);const quote=csvCell;const csv='\ufeff'+[headers].concat(values).map(row=>row.map(quote).join(';')).join('\r\n');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));link.download='solicitacoes-pjes-'+new Date().toISOString().slice(0,10)+'.csv';link.click();URL.revokeObjectURL(link.href);}

async function loadUsers(){if(!state.data.permissoes.administrar)return;const requestToken=state.token;try{$('usersTable').innerHTML='<tr><td colspan="5">Carregando usuários…</td></tr>';const users=await server('apiListarUsuarios',requestToken);if(state.token!==requestToken||!state.data||!state.data.permissoes.administrar)return;state.users=users;renderUsers();}catch(error){if(state.token!==requestToken)return;$('usersTable').innerHTML=`<tr><td colspan="5" class="error">${esc(error.message)}</td></tr>`;}}
function renderUsers(){const users=state.users||[];$('usersTable').innerHTML=users.map((u,index)=>`<tr><td><strong>${esc(u.nome)}</strong><small>${esc(u.email)}${u.acessoFixo?' · acesso fixo':''}</small></td><td><span class="role dark">${esc(u.perfil)}</span></td><td><span class="badge ${u.ativo?'status-concluido':'status-cancelado'}">${u.ativo?'Ativo':'Inativo'}</span></td><td>${u.ultimoAcesso?esc(u.ultimoAcesso):'Nunca'}</td><td><button class="secondary small-button" type="button" onclick="openUserDialog(${index})">Editar</button></td></tr>`).join('')||'<tr><td colspan="5">Nenhum usuário cadastrado.</td></tr>';}
function openUserDialog(index){const user=Number.isInteger(index)&&state.users?state.users[index]:null;$('userDialogTitle').textContent=user?'Editar usuário':'Adicionar usuário';$('userEmailInput').value=user?user.email:'';$('userEmailInput').readOnly=Boolean(user);$('userNameInput').value=user?user.nome:'';$('userRoleInput').value=user?user.perfil:'CONSULTA';$('userActiveInput').checked=user?user.ativo:true;$('userActiveInput').disabled=Boolean(user&&user.acessoFixo);$('userError').textContent='';$('userDialog').showModal();}
$('saveUserButton').onclick=async()=>{const button=$('saveUserButton'),original=button.textContent;button.disabled=true;button.textContent='Salvando…';$('userError').textContent='';try{await server('apiSalvarUsuario',state.token,{email:$('userEmailInput').value,nome:$('userNameInput').value,perfil:$('userRoleInput').value,ativo:$('userActiveInput').checked});$('userDialog').close();toast('Usuário salvo.');await loadUsers();}catch(error){$('userError').textContent=error.message;}finally{button.disabled=false;button.textContent=original;}};

async function loadJudgeRecords(){if(!state.data||!state.data.permissoes.administrar)return;const requestToken=state.token;try{$('adminJudgesTable').innerHTML='<tr><td colspan="7">Carregando cadastros…</td></tr>';const judges=await server('apiListarCadastrosJuizes',requestToken);if(state.token!==requestToken||!state.data||!state.data.permissoes.administrar)return;state.judgeRecords=judges;renderAdminJudges();}catch(error){if(state.token!==requestToken)return;$('adminJudgesTable').innerHTML=`<tr><td colspan="7" class="error">${esc(error.message)}</td></tr>`;}}
function renderAdminJudges(){const term=normalizeSearch($('adminJudgeSearch').value);const rows=(state.judgeRecords||[]).filter(j=>normalizeSearch([j.id,j.nome,j.email,j.materias,j.observacoes,j.status].join(' ')).includes(term));$('adminJudgeCount').textContent=rows.length+' de '+(state.judgeRecords||[]).length+' cadastro(s)';$('adminJudgesTable').innerHTML=rows.map(j=>{const capacidade=j.capacidadeValida?j.capacidadeNumerica+' minutas':'Revisar';const situacao=j.statusValido?`<span class="badge ${statusClass(j.status)}">${esc(j.status)}</span>`:'<span class="badge status-pendente">Status inválido</span>';const alerta=[!j.capacidadeValida?'capacidade inválida':'',j.nomeDuplicado?'nome duplicado':''].filter(Boolean).join(' · ');return `<tr><td><strong>${esc(j.nome||'Nome não informado')}</strong><small>#${j.id} · ${esc(j.email||'E-mail não informado')}</small></td><td>${esc(capacidade)}</td><td>${situacao}${alerta?`<small class="error">${esc(alerta)}</small>`:''}</td><td>${esc(j.materias||'—')}</td><td>${esc(j.observacoes||'—')}</td><td>${j.ativo?'Ativo':'Encerrado'}</td><td><button class="secondary small-button" type="button" onclick="openJudgeDialog(${j.id})">Editar</button></td></tr>`;}).join('')||'<tr><td colspan="7">Nenhum cadastro encontrado.</td></tr>';}
function openJudgeDialog(id){const judge=(state.judgeRecords||[]).find(item=>item.id===Number(id));if(!judge)return toast('Cadastro de juiz não encontrado.','error');$('judgeDialogTitle').textContent='Editar cadastro de juiz';$('judgeIdInput').value=judge.id;$('judgeVersionInput').value=judge.versao||'';$('judgeNameInput').value=judge.nome||'';$('judgeEmailInput').value=judge.email||'';$('judgePhoneInput').value=judge.telefone||'';$('judgeCapacityInput').value=judge.capacidadeValida?judge.capacidadeNumerica:'';$('judgeSubjectsInput').value=judge.materias||'';$('judgeProductivityInput').value=judge.observacoes||'';$('judgeStatusInput').innerHTML=(state.data.statusPermitidos||[]).map(status=>`<option value="${esc(status)}">${esc(status)}</option>`).join('');$('judgeStatusInput').value=judge.status;$('judgeReasonInput').value='';$('judgeError').textContent='';$('judgeDialog').showModal();}
$('saveJudgeButton').onclick=async()=>{if(state.saving)return;const button=$('saveJudgeButton'),original=button.textContent,judge=(state.judgeRecords||[]).find(item=>item.id===Number($('judgeIdInput').value));state.saving=true;button.disabled=true;button.textContent='Salvando…';$('judgeError').textContent='';try{const status=$('judgeStatusInput').value;const justificativa=$('judgeReasonInput').value.trim();if(judge&&status!==judge.status&&['Concluído','Cancelado'].includes(status)&&justificativa.length<5)throw new Error('Informe uma justificativa com pelo menos 5 caracteres ao encerrar o cadastro do juiz.');await server('apiSalvarJuiz',state.token,{id:Number($('judgeIdInput').value),versao:$('judgeVersionInput').value,nome:$('judgeNameInput').value,email:$('judgeEmailInput').value,telefone:$('judgePhoneInput').value,capacidade:$('judgeCapacityInput').value,materias:$('judgeSubjectsInput').value,observacoes:$('judgeProductivityInput').value,status:status,justificativa:justificativa});$('judgeDialog').close();toast('Cadastro de juiz atualizado.');await loadData(true);await loadJudgeRecords();}catch(error){$('judgeError').textContent=error.message;}finally{state.saving=false;button.disabled=false;button.textContent=original;}};

async function setActiveTab(tabName){const panels={requests:'requestsPanel',judges:'judgesPanel',tutorial:'tutorialPanel',admin:'adminPanel'};if(!panels[tabName]||(tabName==='admin'&&!state.data.permissoes.administrar))return;document.querySelectorAll('.tab').forEach(button=>{button.classList.toggle('active',button.dataset.tab===tabName);button.setAttribute('aria-current',button.dataset.tab===tabName?'page':'false');});Object.entries(panels).forEach(([name,id])=>$(id).hidden=name!==tabName);if(tabName==='admin')await Promise.all([loadUsers(),loadJudgeRecords()]);window.scrollTo({top:0,behavior:'smooth'});}

function normalizeSearch(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR').trim();}
function isUpcoming(r){if(!r.prazo||['Concluído','Cancelado'].includes(r.status))return false;const today=state.data.hoje||new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Sao_Paulo'}).format(new Date());const end=new Date(today+'T12:00:00Z');end.setUTCDate(end.getUTCDate()+7);return r.prazo>=today&&r.prazo<=end.toISOString().slice(0,10);}
function setRequestView(view){state.requestView=view==='table'?'table':'cards';storage('localStorage','setItem','jl_request_view',state.requestView);renderRequests(false);}
function changeRequestPage(delta){state.page+=delta;renderRequests(false);$('requestsPanel').focus();}
function requestTable(rows){return `<div class="table-wrap request-table" tabindex="0" role="region" aria-label="Lista de solicitações; role horizontalmente em telas pequenas"><table><caption class="sr-only">Solicitações da página atual</caption><thead><tr><th scope="col">Solicitação e unidade</th><th scope="col">Situação</th><th scope="col">Juiz designado</th><th scope="col">Minutas solicitadas</th><th scope="col">Prazo</th><th scope="col">Ações</th></tr></thead><tbody>${rows.map(r=>`<tr><td><small>#${r.id} · ${esc(r.solicitante)}</small><strong>${esc(r.unidade||'Unidade não informada')}</strong></td><td><div class="table-tags">${requestTags(r)}</div></td><td>${esc(r.juiz||'Não designado')}</td><td>${esc(r.quantidade||'—')}</td><td>${esc(formatDate(r.prazo))}</td><td><div class="table-actions"><button class="secondary small-button" type="button" aria-label="Ver detalhes da solicitação ${r.id}" onclick="openDetails(${r.id})">Detalhes</button>${state.data.permissoes.gerenciar?`<button class="small-button" type="button" aria-label="Gerenciar solicitação ${r.id}" onclick="openEdit(${r.id})">Gerenciar</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`;}
function updateReopenCapacity(){const r=state.currentRequest;const reopening=r&&['Concluído','Cancelado'].includes(r.status)&&!['Concluído','Cancelado'].includes($('editStatus').value)&&r.juiz;const judge=reopening&&state.data.juizes.find(j=>normalizeSearch(j.nome)===normalizeSearch(r.juiz));$('reopenCapacity').hidden=!reopening;$('reopenFields').hidden=true;if(!reopening)return;const quantidade=positiveQuantityInput(),valid=judge&&!judge.requerRevisao&&quantidade!==null;const projected=valid?judge.designadas+quantidade:null;const exceeds=valid&&projected>judge.capacidadeNumerica;$('reopenCapacity').textContent=valid?'Ao reabrir, '+judge.nome+' terá '+projected+' de '+judge.capacidadeNumerica+' minutas atribuídas.':'O cadastro ou a quantidade precisa de revisão antes de reabrir. Para trocar o juiz, use Designar juiz.';$('reopenCapacity').classList.toggle('danger',!valid||exceeds);$('reopenFields').hidden=!exceeds;}
function printRequests(){if(!state.data)return;const rows=filteredRequests();if(!rows.length)return toast('Não existem solicitações para imprimir.','error');const filters=['search','statusFilter','priorityFilter','judgeFilter','unitFilter','flagFilter'].filter(id=>$(id).value).map(id=>id==='search'?'Busca: '+$(id).value:$(id).selectedOptions[0].textContent);$('printReport').innerHTML=`<h1>CONECTA JULES</h1><h2>Relatório de solicitações</h2><p>Dados de ${esc(formatDate(state.data.atualizadoEm,true))} · ${rows.length} solicitação(ões)</p><p>Filtros: ${esc(filters.join(' · ')||'Todos os registros autorizados')}</p><table><thead><tr><th>Registro / Unidade</th><th>Status / Prioridade</th><th>Juiz</th><th>Minutas solicitadas</th><th>Prazo</th></tr></thead><tbody>${rows.map(r=>`<tr><td>#${r.id}<br>${esc(r.unidade)}</td><td>${esc(r.status)}<br>${esc(r.prioridade)}</td><td>${esc(r.juiz||'Não designado')}</td><td>${esc(r.quantidade||'—')}</td><td>${esc(formatDate(r.prazo))}${r.atrasada?' · Vencido':''}</td></tr>`).join('')}</tbody></table><p class="report-footer">Uso institucional · Somente registros disponíveis para o perfil ${esc(state.data.usuario.perfil)}. O relatório inclui todas as páginas do filtro aplicado.</p>`;window.print();}

const tourSteps=[['Visão geral','Os indicadores mostram volume, pendências, atrasos e solicitações sem juiz. Clique nos alertas para filtrar a fila.'],['Solicitações','Use a busca e os filtros para localizar demandas. “Ver detalhes” abre todas as informações e o histórico.'],['Gestão','Em “Gerenciar”, primeiro defina prioridade e prazo, depois designe um juiz ou atualize o andamento.'],['Capacidade','A aba “Juízes e capacidade” mostra carga utilizada, saldo e alertas de lotação.'],['Ajuda permanente','A aba Tutorial mantém todas as instruções disponíveis. Administradores também possuem a aba Administração, com usuários e cadastros de juízes.']];
function startTour(){state.tourStep=0;renderTourStep();$('tourDialog').showModal();}
function renderTourStep(){const step=tourSteps[state.tourStep];$('tourCounter').textContent='Etapa '+(state.tourStep+1)+' de '+tourSteps.length;$('tourTitle').textContent=step[0];$('tourText').textContent=step[1];$('tourNextButton').textContent=state.tourStep===tourSteps.length-1?'Concluir':'Próximo';}
function nextTourStep(){if(state.tourStep>=tourSteps.length-1)return closeTour();state.tourStep++;renderTourStep();}
function closeTour(){storage('localStorage','setItem','jl_tour_done','1');$('tourDialog').close();}

async function logout(){const token=state.token;storage('sessionStorage','removeItem','jl_session');state.token='';state.data=null;state.users=null;state.judgeRecords=[];state.currentRequest=null;$('printReport').innerHTML='';document.querySelectorAll('dialog[open]').forEach(dialog=>dialog.close());showLogin();try{await server('apiLogout',token);}catch(error){$('loginError').textContent='Você saiu deste navegador.';}}
['search','statusFilter','priorityFilter','judgeFilter','unitFilter','flagFilter','sortFilter'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',renderRequests));
$('editJudge').addEventListener('change',updateAssignmentCapacity);
$('editQuantity').addEventListener('input',()=>{updateAssignmentCapacity();updateReopenCapacity();});
$('editStatus').addEventListener('change',updateReopenCapacity);
$('adminJudgeSearch').addEventListener('input',renderAdminJudges);
$('pageSize').addEventListener('change',()=>renderRequests());
$('editDialog').addEventListener('cancel',event=>{if(state.saving)event.preventDefault();});
$('editForm').addEventListener('submit',event=>{if(state.saving)event.preventDefault();});
$('judgeDialog').addEventListener('cancel',event=>{if(state.saving)event.preventDefault();});
$('judgeForm').addEventListener('submit',event=>{if(state.saving)event.preventDefault();});
document.querySelectorAll('.tab').forEach(button=>button.onclick=()=>setActiveTab(button.dataset.tab));
$('judgeSearch').addEventListener('input',renderJudges);
setInterval(()=>{if(state.token&&state.data&&!document.hidden&&!state.saving&&!document.querySelector('dialog[open]')&&$('autoRefresh').checked)loadData(true);},60000);
boot();
</script>
